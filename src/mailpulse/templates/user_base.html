{% extends "base.html" %}
{% block body_class %}app-mode{% endblock %}
{% block header %}
<header class="sidebar">
  <div class="sidebar-brand">
    <a class="brand" href="/">MailPulse</a>
    <span class="brand-sub">邮件归纳工作台</span>
  </div>
  <nav class="side-nav" aria-label="工作台导航">
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">
      <span class="nav-icon">◈</span>概览
    </a>
    <a href="/tasks" class="{{ 'active' if request.url.path.startswith('/tasks') else '' }}">
      <span class="nav-icon">▤</span>任务
    </a>
    <a href="/messages" class="{{ 'active' if request.url.path.startswith('/messages') else '' }}">
      <span class="nav-icon">✉</span>邮件
    </a>
    <a href="/reports" class="{{ 'active' if request.url.path.startswith('/reports') else '' }}">
      <span class="nav-icon">▣</span>报告
    </a>
  </nav>
  <div class="sidebar-footer">
    <a href="/account" class="account-link {{ 'active' if request.url.path.startswith('/account') else '' }}">
      <span class="avatar">{{ user.display_name[:1] }}</span>
      <span class="account-meta"><strong>{{ user.display_name }}</strong><small>{{ user.username }}</small></span>
    </a>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="link-button logout" type="submit">退出登录</button>
    </form>
  </div>
</header>
{% endblock %}
