{% extends "base.html" %}
{% block header %}
<header class="topbar user-topbar">
  <a class="brand" href="/">MailPulse</a>
  <nav class="main-nav user-nav" aria-label="用户工作台">
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">概览</a>
    <a href="/messages" class="{{ 'active' if request.url.path.startswith('/messages') else '' }}">邮件</a>
    <a href="/rules" class="{{ 'active' if request.url.path.startswith('/rules') else '' }}">筛选规则</a>
    <a href="/schedules" class="{{ 'active' if request.url.path.startswith('/schedules') else '' }}">定时任务</a>
    <a href="/reports" class="{{ 'active' if request.url.path.startswith('/reports') else '' }}">报告</a>
    <a href="/settings" class="{{ 'active' if request.url.path.startswith('/settings') else '' }}">邮箱设置</a>
  </nav>
  <span class="session-user">{{ user.display_name }}</span>
  <form class="session-actions" method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="link-button" type="submit">退出</button></form>
</header>
{% endblock %}
